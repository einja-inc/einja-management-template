name: Cleanup PR Preview (on close)

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository != 'einja-inc/einja-management-template' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Export Neon environment variables
        uses: ./.github/actions/neon-export-env
        with:
          dotenv-private-key-preview: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
      - name: Remove Vercel preview aliases
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm add -g vercel@latest
          for PROJECT_ID in "${{ secrets.VERCEL_PROJECT_ID_WEB }}" "${{ secrets.VERCEL_PROJECT_ID_ADMIN }}"; do
            PROJECT_NAME=$(curl -s \
              "https://api.vercel.com/v9/projects/$PROJECT_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.name')
            if [ -n "$PROJECT_NAME" ] && [ "$PROJECT_NAME" != "null" ]; then
              PROJECT_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
              ALIAS="${PROJECT_NAME}-pr-${{ github.event.number }}.vercel.app"
              echo "Removing alias: $ALIAS"
              vercel alias rm "$ALIAS" --token=$VERCEL_TOKEN --yes || true
            else
              echo "::warning::プロジェクト名を取得できませんでした (project_id: $PROJECT_ID)"
            fi
          done
      - name: Delete Neon Branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ env.NEON_API_KEY }}
