name: default
displayName: "Einja ATDD Workflow"
description: "ATDDワークフロー構成（Next.js、Vibe-Kanban統合）"
version: "1.0.0"

# 変数定義（ユーザーがカスタマイズ可能）
variables:
  # CLAUDE.mdテンプレート用
  PROJECT_NAME: "my-project"
  INSTALL_COMMAND: "pnpm install"
  DEV_COMMAND: "pnpm dev"
  START_COMMAND: "pnpm start"
  FORMAT_COMMAND: "pnpm format"
  # 既存の変数
  BUILD_COMMAND: "pnpm build"
  TEST_COMMAND: "pnpm test"
  LINT_COMMAND: "pnpm lint"
  TYPE_CHECK_COMMAND: "pnpm typecheck"
  PROJECT_STRUCTURE: |
    src/           # ソースコード
    tests/         # テストコード
  CODING_STANDARDS_PATH: "README.md"
  MCP_TOOLS: |
    - Serena MCP: コード分析・編集
    - Playwright MCP: ブラウザテスト
    - GitHub MCP: Issue・PR操作

# MCP設定
mcpServers:
  - codex
  - context7
  - playwright
  - serena
  - github

# 追加パーミッション
additionalPermissions:
  - "Bash(npm:*)"
  - "Bash(pnpm:*)"
  - "Bash(npx:*)"
  - "Bash(node:*)"
  - "Bash(yarn:*)"
  - "Bash(bun:*)"
  - "Bash(python3:*)"
  - "Bash(curl:*)"
  - "Bash(wget:*)"
  - "Bash(unzip:*)"
  - "Bash(docker-compose :*)"
  - "Bash(jq:*)"
  - "mcp__codex__codex"
  - "mcp__github__get_pull_request"
  - "mcp__github__get_pull_request_files"
  - "mcp__github__update_pull_request"
  - "mcp__github__list_commits"
  - "mcp__github__get_commit"
  - "mcp__github__get_file_contents"
  - "mcp__github__search_code"
  - "mcp__playwright"
  - "mcp__playwright__browser_navigate"
  - "mcp__playwright__browser_click"
  - "mcp__playwright__browser_wait_for"
  - "mcp__playwright__browser_evaluate"
  - "mcp__playwright__browser_snapshot"
  - "mcp__playwright__browser_console_messages"
  - "mcp__playwright__browser_handle_dialog"
  - "mcp__playwright__browser_type"
  - "mcp__serena"
  - "mcp__serena__activate_project"
  - "mcp__serena__check_onboarding_performed"
  - "mcp__serena__find_file"
  - "mcp__serena__find_referencing_symbols"
  - "mcp__serena__find_symbol"
  - "mcp__serena__get_symbols_overview"
  - "mcp__serena__insert_before_symbol"
  - "mcp__serena__list_dir"
  - "mcp__serena__replace_symbol_body"
  - "mcp__serena__search_for_pattern"
  - "mcp__serena__think_about_collected_information"
  - "mcp__serena__think_about_whether_you_are_done"
  - "Bash(test:*)"
  - "Bash(gh pr view:*)"
  - "Bash(gh pr close:*)"
  - "Bash(gh pr create:*)"
  - "Bash(gh pr list:*)"
  - "Bash(tree:*)"
  - "Bash(bash:*)"
  - "Bash(./verify.sh:*)"
  - "Bash(gh issue create:*)"
  - "Skill(task-exec)"
  - "Skill(task-qa)"

# 追加エージェント
additionalAgents:
  - frontend-architect
  - design-engineer
  - frontend-coder

# 追加コマンド
additionalCommands:
  - frontend-implement
  - start-dev

# 依存関係チェック（init/sync時に自動チェック+インストール）
requirements:
  # hooksが動作するために必要なnpmパッケージ
  devDependencies:
    "@biomejs/biome": "^1.9.4"
    "typescript": "^5"

  # 不足時に追加するnpm scripts（キーが存在しない場合のみ追加）
  scripts:
    lint: "biome check ."
    "lint:fix": "biome check --write ."
    format: "biome format ."
    "format:fix": "biome format --write ."
    typecheck: "tsc --noEmit"
    prepush: "{pm} run lint && {pm} run typecheck"
    "task:loop": "npx @einja-inc/dev-cli@latest task:loop"
    "einja:sync": "npx @einja-inc/dev-cli@latest sync"

  # システムコマンド（警告表示のみ、自動インストールしない）
  systemCommands:
    - command: jq
      description: "JSON processor（全hooksで使用）"
      install:
        darwin: "brew install jq"
        linux: "sudo apt-get install jq"
        win32: "choco install jq"
