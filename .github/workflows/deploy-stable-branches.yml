name: Deploy Stable Branches

on:
  push:
    branches: [main, develop, staging]

# GITHUB_TOKENで作成されたpushイベントはデフォルトでワークフロー再トリガーしない
# 念のため明示的にbotコミットを除外（release-productionのバージョンバンプ対策）

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    # github-actions[bot] のバージョンバンプコミットはスキップ
    if: "github.repository != 'einja-inc/einja-management-template' && !contains(github.event.head_commit.message, 'chore: release v') && !contains(github.event.head_commit.message, 'chore: release cli-v') && !contains(github.event.head_commit.message, 'chore: release create-app-v')"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Run CI checks
        uses: ./.github/actions/ci
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/test_db

  # 変更検知
  changes:
    if: github.repository != 'einja-inc/einja-management-template'
    runs-on: ubuntu-latest
    outputs:
      deploy_matrix: ${{ steps.detect.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover apps
        id: apps
        uses: ./.github/actions/discover-apps

      - name: Detect changed apps
        id: detect
        run: |
          set -euo pipefail

          APPS_JSON='${{ steps.apps.outputs.apps_json }}'
          BEFORE="${{ github.event.before }}"

          # Force push or initial push fallback
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::No valid base commit (force push or initial push). Deploying all apps."
            echo "deploy_matrix=$APPS_JSON" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Validate base commit exists
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "::warning::Base commit $BEFORE not found. Deploying all apps."
            echo "deploy_matrix=$APPS_JSON" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null) || {
            echo "::warning::git diff failed. Deploying all apps."
            echo "deploy_matrix=$APPS_JSON" >> $GITHUB_OUTPUT
            exit 0
          }

          # Load config
          CONFIG_FILE=".github/app-config.json"
          GLOBAL_TRIGGERS='[]'
          PACKAGE_MAPPING='{}'
          if [ -f "$CONFIG_FILE" ]; then
            GLOBAL_TRIGGERS=$(jq -c '.globalTriggers // []' "$CONFIG_FILE")
            PACKAGE_MAPPING=$(jq -c '."shared-package-mapping" // {}' "$CONFIG_FILE")
          fi

          TEMP_MATRIX=$(mktemp)
          trap 'rm -f "$TEMP_MATRIX"' EXIT
          echo '[]' > "$TEMP_MATRIX"

          APP_COUNT=$(echo "$APPS_JSON" | jq 'length')
          for i in $(seq 0 $((APP_COUNT - 1))); do
            APP=$(echo "$APPS_JSON" | jq -r ".[$i].app")
            SUFFIX=$(echo "$APPS_JSON" | jq -r ".[$i].secret_suffix")
            SHOULD_DEPLOY=false

            # Check direct app changes
            if echo "$CHANGED_FILES" | grep -q "^apps/$APP/"; then
              SHOULD_DEPLOY=true
            fi

            # Check global triggers (convert glob to regex: escape dots, ** → .*, * → [^/]*)
            if [ "$SHOULD_DEPLOY" = "false" ]; then
              TRIGGER_COUNT=$(echo "$GLOBAL_TRIGGERS" | jq 'length')
              for j in $(seq 0 $((TRIGGER_COUNT - 1))); do
                pattern=$(echo "$GLOBAL_TRIGGERS" | jq -r ".[$j]")
                GREP_PATTERN=$(echo "$pattern" | sed 's/\./\\./g' | sed 's/\*\*/.*/g' | sed 's/\*/[^\/]*/g')
                if echo "$CHANGED_FILES" | grep -qE "^${GREP_PATTERN}$"; then
                  SHOULD_DEPLOY=true
                  break
                fi
              done
            fi

            # Check shared package mapping
            if [ "$SHOULD_DEPLOY" = "false" ]; then
              for pkg_path in $(echo "$PACKAGE_MAPPING" | jq -r 'keys[]'); do
                if echo "$CHANGED_FILES" | grep -q "^${pkg_path}/"; then
                  if echo "$PACKAGE_MAPPING" | jq -e --arg pkg "$pkg_path" --arg app "$APP" '.[$pkg] | index($app) != null' > /dev/null 2>&1; then
                    SHOULD_DEPLOY=true
                    break
                  fi
                fi
              done
            fi

            # Fallback: if no config, any packages/ change triggers all apps
            if [ "$SHOULD_DEPLOY" = "false" ] && [ ! -f "$CONFIG_FILE" ]; then
              if echo "$CHANGED_FILES" | grep -q "^packages/"; then
                SHOULD_DEPLOY=true
              fi
            fi

            if [ "$SHOULD_DEPLOY" = "true" ]; then
              CURRENT=$(cat "$TEMP_MATRIX")
              echo "$CURRENT" | jq -c --arg app "$APP" --arg suffix "$SUFFIX" \
                '. + [{"app": $app, "secret_suffix": $suffix}]' > "$TEMP_MATRIX"
            fi
          done

          DEPLOY_MATRIX=$(cat "$TEMP_MATRIX")

          echo "deploy_matrix=$DEPLOY_MATRIX" >> $GITHUB_OUTPUT
          echo "Deploy matrix: $DEPLOY_MATRIX"

  # ========================================
  # develop: 環境なし、承認なし
  # ========================================
  migrate-develop:
    needs: ci
    if: github.repository != 'einja-inc/einja-management-template' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migrate develop
        uses: ./.github/actions/migrate
        with:
          dotenv-file: ${{ github.workspace }}/.env.develop
          dotenv-private-key: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOP }}
          run-seed: 'false'

  deploy-develop:
    needs: [ci, migrate-develop, changes]
    if: github.repository != 'einja-inc/einja-management-template' && github.ref_name == 'develop' && needs.changes.outputs.deploy_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Set VERCEL_PROJECT_ID
        run: echo "VERCEL_PROJECT_ID=${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.secret_suffix)] }}" >> $GITHUB_ENV

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Set deploy environment
        run: |
          echo "DEPLOY_DOTENV_FILE=$GITHUB_WORKSPACE/.env.develop" >> $GITHUB_ENV
          echo "DEPLOY_VERCEL_ENV=preview" >> $GITHUB_ENV
          echo "DEPLOY_PROD_FLAG=" >> $GITHUB_ENV
          echo "DEPLOY_RUN_ALIAS=true" >> $GITHUB_ENV

      - name: Extract alias domain
        run: |
          npx dotenvx run -f ${{ env.DEPLOY_DOTENV_FILE }} -- bash -c "
            echo \"VERCEL_ALIAS_DOMAIN=\$VERCEL_ALIAS_DOMAIN_${{ matrix.secret_suffix }}\" >> \"\$GITHUB_ENV\"
          "
        env:
          DOTENV_PRIVATE_KEY_DEVELOP: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOP }}

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=${{ env.DEPLOY_VERCEL_ENV }} --token=$VERCEL_TOKEN

      - name: Build Project
        run: |
          npx dotenvx run -f ${{ env.DEPLOY_DOTENV_FILE }} -- \
            vercel build ${{ env.DEPLOY_PROD_FLAG }} --token=$VERCEL_TOKEN
        env:
          DOTENV_PRIVATE_KEY_DEVELOP: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOP }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          npx dotenvx run -f $DEPLOY_DOTENV_FILE -- bash -c '
            declare -a ENV_FLAGS=()
            while IFS= read -r key; do
              case "$key" in
                NEON_*|VERCEL_ALIAS_DOMAIN_*|DOTENV_PUBLIC_KEY_*) continue ;;
              esac
              value="${!key}"
              if [ -n "$value" ]; then
                echo "::add-mask::${value}"
              fi
              ENV_FLAGS+=("--env" "${key}=${value}")
            done < <(grep -E "^[A-Z_][A-Z0-9_]*=\"?encrypted:" "$DEPLOY_DOTENV_FILE" | cut -d= -f1)

            echo "Deploying with ${#ENV_FLAGS[@]} runtime env vars..."
            DEPLOY_URL=$(vercel deploy --prebuilt --archive=tgz $DEPLOY_PROD_FLAG "${ENV_FLAGS[@]}" --token="$VERCEL_TOKEN")
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          '
        env:
          DOTENV_PRIVATE_KEY_DEVELOP: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOP }}

      - name: Set Vercel alias
        run: vercel alias ${{ steps.deploy.outputs.url }} "${{ env.VERCEL_ALIAS_DOMAIN }}" --token=$VERCEL_TOKEN

  # ========================================
  # staging: staging環境、承認なし
  # ========================================
  migrate-staging:
    needs: ci
    if: github.repository != 'einja-inc/einja-management-template' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migrate staging
        uses: ./.github/actions/migrate
        with:
          dotenv-file: ${{ github.workspace }}/.env.staging
          dotenv-private-key: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}
          run-seed: 'false'

  deploy-staging:
    needs: [ci, migrate-staging, changes]
    if: github.repository != 'einja-inc/einja-management-template' && github.ref_name == 'staging' && needs.changes.outputs.deploy_matrix != '[]'
    environment: staging
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Set VERCEL_PROJECT_ID
        run: echo "VERCEL_PROJECT_ID=${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.secret_suffix)] }}" >> $GITHUB_ENV

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Set deploy environment
        run: |
          echo "DEPLOY_DOTENV_FILE=$GITHUB_WORKSPACE/.env.staging" >> $GITHUB_ENV
          echo "DEPLOY_VERCEL_ENV=preview" >> $GITHUB_ENV
          echo "DEPLOY_PROD_FLAG=" >> $GITHUB_ENV
          echo "DEPLOY_RUN_ALIAS=true" >> $GITHUB_ENV

      - name: Extract alias domain
        run: |
          npx dotenvx run -f ${{ env.DEPLOY_DOTENV_FILE }} -- bash -c "
            echo \"VERCEL_ALIAS_DOMAIN=\$VERCEL_ALIAS_DOMAIN_${{ matrix.secret_suffix }}\" >> \"\$GITHUB_ENV\"
          "
        env:
          DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=${{ env.DEPLOY_VERCEL_ENV }} --token=$VERCEL_TOKEN

      - name: Build Project
        run: |
          npx dotenvx run -f ${{ env.DEPLOY_DOTENV_FILE }} -- \
            vercel build ${{ env.DEPLOY_PROD_FLAG }} --token=$VERCEL_TOKEN
        env:
          DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          npx dotenvx run -f $DEPLOY_DOTENV_FILE -- bash -c '
            declare -a ENV_FLAGS=()
            while IFS= read -r key; do
              case "$key" in
                NEON_*|VERCEL_ALIAS_DOMAIN_*|DOTENV_PUBLIC_KEY_*) continue ;;
              esac
              value="${!key}"
              if [ -n "$value" ]; then
                echo "::add-mask::${value}"
              fi
              ENV_FLAGS+=("--env" "${key}=${value}")
            done < <(grep -E "^[A-Z_][A-Z0-9_]*=\"?encrypted:" "$DEPLOY_DOTENV_FILE" | cut -d= -f1)

            echo "Deploying with ${#ENV_FLAGS[@]} runtime env vars..."
            DEPLOY_URL=$(vercel deploy --prebuilt --archive=tgz $DEPLOY_PROD_FLAG "${ENV_FLAGS[@]}" --token="$VERCEL_TOKEN")
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          '
        env:
          DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}

      - name: Set Vercel alias
        run: vercel alias ${{ steps.deploy.outputs.url }} "${{ env.VERCEL_ALIAS_DOMAIN }}" --token=$VERCEL_TOKEN

  # staging: PreRelease作成（changeset未消費）
  release-staging:
    needs: [ci]
    if: github.repository != 'einja-inc/einja-management-template' && always() && github.ref_name == 'staging' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const merged = prs.data.find(p => p.merged_at && p.base.ref === 'staging');
            core.setOutput('pr_number', merged ? merged.number : '');

      - name: Check for changesets
        id: check
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "has_changesets=$([[ $COUNT -gt 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Create PreRelease tag
        if: steps.check.outputs.has_changesets == 'true'
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-rc.${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish PreRelease
        if: steps.tag.outputs.tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const prNumber = '${{ steps.pr.outputs.pr_number }}';

            if (prNumber) {
              const draftTag = `draft-pr-${prNumber}`;
              let draft = null;
              try {
                const resp = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: draftTag
                });
                draft = resp.data;
              } catch (e) {
                if (e.status !== 404) throw e;
                core.warning(`No draft release found for PR #${prNumber}`);
              }

              if (draft) {
                // Tag already exists from git push above, just update the release
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: draft.id,
                  tag_name: tag,
                  name: `Pre-release ${tag}`,
                  draft: false,
                  prerelease: true,
                  target_commitish: context.sha
                });

                // Delete the old temp tag
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${draftTag}`
                  });
                } catch (e) {
                  core.warning(`Failed to delete temp tag ${draftTag}: ${e.message}`);
                }

                core.info(`Published pre-release ${tag} from draft-pr-${prNumber}`);
              } else {
                // Fallback: create a new release
                await exec.exec('gh', [
                  'release', 'create', tag,
                  '--title', `Pre-release ${tag}`,
                  '--prerelease',
                  '--target', 'staging',
                  '--generate-notes'
                ]);
              }
            } else {
              // No PR found, create release directly
              await exec.exec('gh', [
                'release', 'create', tag,
                '--title', `Pre-release ${tag}`,
                '--prerelease',
                '--target', 'staging',
                '--generate-notes'
              ]);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup draft release (no changesets)
        if: steps.check.outputs.has_changesets == 'false' && steps.pr.outputs.pr_number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ steps.pr.outputs.pr_number }}';
            const draftTag = `draft-pr-${prNumber}`;

            // Delete draft release
            try {
              const resp = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: draftTag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: resp.data.id,
              });
              core.info(`Deleted draft release for PR #${prNumber}`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info('No draft release found, skipping');
            }

            // Delete temp tag
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${draftTag}`
              });
              core.info(`Deleted tag ${draftTag}`);
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) throw e;
              core.info(`Tag ${draftTag} already deleted or not found`);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # main: production環境、1名承認 → migrate → deploy → release
  # ========================================
  migrate-production:
    needs: ci
    if: github.repository != 'einja-inc/einja-management-template' && github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migrate production
        uses: ./.github/actions/migrate
        with:
          dotenv-file: ${{ github.workspace }}/.env.production
          dotenv-private-key: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          run-seed: 'false'

  deploy-production:
    needs: [migrate-production, changes]
    if: github.repository != 'einja-inc/einja-management-template' && github.ref_name == 'main' && needs.changes.outputs.deploy_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Set VERCEL_PROJECT_ID
        run: echo "VERCEL_PROJECT_ID=${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.secret_suffix)] }}" >> $GITHUB_ENV

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Set deploy environment
        run: |
          echo "DEPLOY_DOTENV_FILE=$GITHUB_WORKSPACE/.env.production" >> $GITHUB_ENV
          echo "DEPLOY_VERCEL_ENV=production" >> $GITHUB_ENV
          echo "DEPLOY_PROD_FLAG=--prod" >> $GITHUB_ENV
          echo "DEPLOY_RUN_ALIAS=false" >> $GITHUB_ENV

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=${{ env.DEPLOY_VERCEL_ENV }} --token=$VERCEL_TOKEN

      - name: Sync environment variables to Vercel
        run: |
          npx dotenvx run -f ${{ env.DEPLOY_DOTENV_FILE }} -- bash -c '
            grep -E "^[A-Z_][A-Z0-9_]*=\"?encrypted:" ${{ env.DEPLOY_DOTENV_FILE }} | cut -d= -f1 | while read -r key; do
              case "$key" in
                NEON_*) continue ;;
              esac
              value="${!key}"
              if [ -n "$value" ]; then
                echo "Syncing $key to Vercel (${{ env.DEPLOY_VERCEL_ENV }})..."
                echo "$value" | vercel env rm "$key" ${{ env.DEPLOY_VERCEL_ENV }} --yes --token=$VERCEL_TOKEN 2>/dev/null || true
                echo "$value" | vercel env add "$key" ${{ env.DEPLOY_VERCEL_ENV }} --token=$VERCEL_TOKEN
              fi
            done
          '
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Re-pull Vercel Environment after sync
        run: vercel pull --yes --environment=${{ env.DEPLOY_VERCEL_ENV }} --token=$VERCEL_TOKEN

      - name: Build Project
        run: |
          npx dotenvx run -f ${{ env.DEPLOY_DOTENV_FILE }} -- \
            vercel build ${{ env.DEPLOY_PROD_FLAG }} --token=$VERCEL_TOKEN
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          npx dotenvx run -f $DEPLOY_DOTENV_FILE -- bash -c '
            declare -a ENV_FLAGS=()
            while IFS= read -r key; do
              case "$key" in
                NEON_*|VERCEL_ALIAS_DOMAIN_*|DOTENV_PUBLIC_KEY_*) continue ;;
              esac
              value="${!key}"
              if [ -n "$value" ]; then
                echo "::add-mask::${value}"
              fi
              ENV_FLAGS+=("--env" "${key}=${value}")
            done < <(grep -E "^[A-Z_][A-Z0-9_]*=\"?encrypted:" "$DEPLOY_DOTENV_FILE" | cut -d= -f1)

            echo "Deploying with ${#ENV_FLAGS[@]} runtime env vars..."
            DEPLOY_URL=$(vercel deploy --prebuilt --archive=tgz $DEPLOY_PROD_FLAG "${ENV_FLAGS[@]}" --token="$VERCEL_TOKEN")
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          '
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

  # main: changeset消費 + Release作成
  release-production:
    needs: [ci, migrate-production, deploy-production]
    if: >
      github.repository != 'einja-inc/einja-management-template' &&
      always() && github.ref_name == 'main' &&
      needs.ci.result == 'success' &&
      needs.migrate-production.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-production.result)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve merged PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const merged = prs.data.find(p => p.merged_at && p.base.ref === 'main');
            core.setOutput('pr_number', merged ? merged.number : '');

      - name: Check for changesets
        id: check
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "has_changesets=$([[ $COUNT -gt 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Version packages
        if: steps.check.outputs.has_changesets == 'true'
        run: npx changeset version

      - name: Commit version bump and create Release
        if: steps.check.outputs.has_changesets == 'true'
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('./package.json').version;
            const tag = `v${version}`;
            const prNumber = '${{ steps.pr.outputs.pr_number }}';

            // Git config, add, commit, tag, push
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', 'package.json', 'pnpm-lock.yaml', '.changeset/']);
            try {
              await exec.exec('git', ['commit', '-m', `chore: release ${tag}`]);
            } catch (e) {
              core.info('No changes to commit');
            }
            await exec.exec('git', ['tag', tag]);
            await exec.exec('git', ['push', 'origin', 'main', '--follow-tags']);

            if (prNumber) {
              const draftTag = `draft-pr-${prNumber}`;
              let draft = null;
              try {
                const resp = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: draftTag
                });
                draft = resp.data;
              } catch (e) {
                if (e.status !== 404) throw e;
                core.warning(`No draft release found for PR #${prNumber}`);
              }

              if (draft) {
                // Update the draft release to the real tag
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: draft.id,
                  tag_name: tag,
                  name: `Release ${tag}`,
                  draft: false,
                  prerelease: false,
                  target_commitish: context.sha
                });

                // Delete the old temp tag
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${draftTag}`
                  });
                } catch (e) {
                  core.warning(`Failed to delete temp tag ${draftTag}: ${e.message}`);
                }

                core.info(`Published release ${tag} from draft-pr-${prNumber}`);
              } else {
                // Fallback: create a new release
                await exec.exec('gh', [
                  'release', 'create', tag,
                  '--title', `Release ${tag}`,
                  '--target', 'main',
                  '--generate-notes'
                ]);
              }
            } else {
              // No PR found, create release directly
              await exec.exec('gh', [
                'release', 'create', tag,
                '--title', `Release ${tag}`,
                '--target', 'main',
                '--generate-notes'
              ]);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup draft release (no changesets)
        if: steps.check.outputs.has_changesets == 'false' && steps.pr.outputs.pr_number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ steps.pr.outputs.pr_number }}';
            const draftTag = `draft-pr-${prNumber}`;

            // Delete draft release
            try {
              const resp = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: draftTag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: resp.data.id,
              });
              core.info(`Deleted draft release for PR #${prNumber}`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info('No draft release found, skipping');
            }

            // Delete temp tag
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${draftTag}`
              });
              core.info(`Deleted tag ${draftTag}`);
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) throw e;
              core.info(`Tag ${draftTag} already deleted or not found`);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
