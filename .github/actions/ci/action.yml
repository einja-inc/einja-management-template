name: 'CI Checks'
description: 'Run CI checks including setup, type check, lint, and tests'

runs:
  using: 'composite'
  steps:
    - name: Setup Environment
      uses: ./.github/actions/setup

    - name: Generate artifacts
      run: pnpm generate
      shell: bash

    - name: Run TypeScript type check
      run: pnpm typecheck
      shell: bash

    - name: Run lint
      run: pnpm lint
      shell: bash

    - name: Run tests
      run: pnpm test
      shell: bash

