name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # CI チェック（PostgreSQLサービスコンテナ付き）
  ci:
    if: github.repository != 'einja-inc/einja-management-template' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/test_db

  # Neon Branch作成 + スキーマ同期 + シード
  neon-and-schema:
    if: github.repository != 'einja-inc/einja-management-template'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      branch_id: ${{ steps.create-branch.outputs.branch_id }}
      neon_parent: ${{ steps.neon-parent.outputs.parent }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # 0. .env.previewからNeon環境変数をエクスポート
      - name: Export Neon environment variables
        uses: ./.github/actions/neon-export-env
        with:
          dotenv-private-key-preview: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}

      - name: Generate artifacts
        run: pnpm generate

      # 1. Neon親ブランチの動的選択（フォールバック付き）
      - name: Determine Neon parent branch
        id: neon-parent
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"

          # Gitブランチ名 → Neonブランチ名のマッピング
          case "$BASE_REF" in
            main)    NEON_BRANCH="production" ;;
            develop) NEON_BRANCH="development" ;;
            *)       NEON_BRANCH="$BASE_REF" ;;
          esac

          echo "Git base branch: $BASE_REF → Neon branch: $NEON_BRANCH"

          # Neon APIでブランチの存在を確認
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://console.neon.tech/api/v2/projects/${{ env.NEON_PROJECT_ID }}/branches?search=$NEON_BRANCH" \
            -H "Authorization: Bearer ${{ env.NEON_API_KEY }}" \
            -H "Accept: application/json")

          if [ "$HTTP_STATUS" = "200" ]; then
            # ブランチ一覧から完全一致を確認
            BRANCH_EXISTS=$(curl -s \
              "https://console.neon.tech/api/v2/projects/${{ env.NEON_PROJECT_ID }}/branches?search=$NEON_BRANCH" \
              -H "Authorization: Bearer ${{ env.NEON_API_KEY }}" \
              -H "Accept: application/json" | jq -r ".branches[] | select(.name == \"$NEON_BRANCH\") | .name")

            if [ -n "$BRANCH_EXISTS" ]; then
              echo "parent=$NEON_BRANCH" >> $GITHUB_OUTPUT
              echo "Neon parent branch: $NEON_BRANCH"
            else
              echo "parent=production" >> $GITHUB_OUTPUT
              echo "Neon parent branch: production (fallback - '$NEON_BRANCH' not found in Neon)"
            fi
          else
            echo "parent=production" >> $GITHUB_OUTPUT
            echo "Neon parent branch: production (fallback - API returned $HTTP_STATUS)"
          fi

      # 2. Neon Branch 作成（v6 + expires_at）
      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ env.NEON_API_KEY }}
          parent_branch: ${{ steps.neon-parent.outputs.parent }}
          # 1日間アクセスがなければサスペンド（コスト削減）
          suspend_timeout: 86400

      # 2.5. DB URLの解決（connection_uri API方式）
      - name: Resolve DB URLs
        id: resolve-db
        run: |
          DB_URL="${{ steps.create-branch.outputs.db_url }}"
          DB_URL_POOLED="${{ steps.create-branch.outputs.db_url_pooled }}"

          if [ -z "$DB_URL" ] || [ -z "$DB_URL_POOLED" ]; then
            echo "::notice::Branch was reused — fetching DB URLs from Neon API..."
            BRANCH_ID="${{ steps.create-branch.outputs.branch_id }}"

            # connection_uri APIで直接URL取得（sed不要）
            DB_URL=$(curl -s \
              "https://console.neon.tech/api/v2/projects/${{ env.NEON_PROJECT_ID }}/connection_uri?branch_id=$BRANCH_ID&pooled=false&database_name=neondb&role_name=neondb_owner" \
              -H "Authorization: Bearer ${{ env.NEON_API_KEY }}" \
              -H "Accept: application/json" | jq -r '.uri')

            DB_URL_POOLED=$(curl -s \
              "https://console.neon.tech/api/v2/projects/${{ env.NEON_PROJECT_ID }}/connection_uri?branch_id=$BRANCH_ID&pooled=true&database_name=neondb&role_name=neondb_owner" \
              -H "Authorization: Bearer ${{ env.NEON_API_KEY }}" \
              -H "Accept: application/json" | jq -r '.uri')

            if [ -z "$DB_URL" ] || [ "$DB_URL" = "null" ] || [ -z "$DB_URL_POOLED" ] || [ "$DB_URL_POOLED" = "null" ]; then
              echo "::error::Failed to resolve DB URLs from Neon API"
              exit 1
            fi
          fi

          # ログへの漏洩を防止
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$DB_URL_POOLED"

          # heredoc形式でGITHUB_OUTPUTに書き込み（特殊文字対応）
          {
            echo "db_url<<NEON_EOF"
            echo "$DB_URL"
            echo "NEON_EOF"
            echo "db_url_pooled<<NEON_EOF"
            echo "$DB_URL_POOLED"
            echo "NEON_EOF"
          } >> "$GITHUB_OUTPUT"

      # 3. マイグレーション + シード（直接接続）
      - name: Run Migration
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ steps.resolve-db.outputs.db_url }}

      - name: Run Seed
        run: pnpm --filter @repo/server-core db:seed
        env:
          DATABASE_URL: ${{ steps.resolve-db.outputs.db_url }}

  # アプリ検出
  discover:
    if: github.repository != 'einja-inc/einja-management-template'
    runs-on: ubuntu-latest
    outputs:
      apps_json: ${{ steps.apps.outputs.apps_json }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover apps
        id: apps
        uses: ./.github/actions/discover-apps

  # アプリデプロイ（並列実行）
  deploy:
    if: github.repository != 'einja-inc/einja-management-template'
    needs: [neon-and-schema, discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.apps_json) }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Neon環境変数のエクスポート（DB URL取得に必要）
      - name: Export Neon environment variables
        uses: ./.github/actions/neon-export-env
        with:
          dotenv-private-key-preview: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}

      # Neon APIからDB URLを取得（connection_uri API方式）
      - name: Fetch DB URLs from Neon API
        id: db-urls
        run: |
          BRANCH_ID="${{ needs.neon-and-schema.outputs.branch_id }}"

          # connection_uri APIで直接URL取得
          DB_URL=$(curl -s \
            "https://console.neon.tech/api/v2/projects/${{ env.NEON_PROJECT_ID }}/connection_uri?branch_id=$BRANCH_ID&pooled=false&database_name=neondb&role_name=neondb_owner" \
            -H "Authorization: Bearer ${{ env.NEON_API_KEY }}" \
            -H "Accept: application/json" | jq -r '.uri')

          DB_URL_POOLED=$(curl -s \
            "https://console.neon.tech/api/v2/projects/${{ env.NEON_PROJECT_ID }}/connection_uri?branch_id=$BRANCH_ID&pooled=true&database_name=neondb&role_name=neondb_owner" \
            -H "Authorization: Bearer ${{ env.NEON_API_KEY }}" \
            -H "Accept: application/json" | jq -r '.uri')

          if [ -z "$DB_URL" ] || [ "$DB_URL" = "null" ] || [ -z "$DB_URL_POOLED" ] || [ "$DB_URL_POOLED" = "null" ]; then
            echo "::error::Failed to resolve DB URLs from Neon API"
            exit 1
          fi

          echo "::add-mask::$DB_URL"
          echo "::add-mask::$DB_URL_POOLED"

          {
            echo "db_url<<NEON_EOF"
            echo "$DB_URL"
            echo "NEON_EOF"
            echo "db_url_pooled<<NEON_EOF"
            echo "$DB_URL_POOLED"
            echo "NEON_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate DATABASE_URL
        run: |
          if [ -z "${{ steps.db-urls.outputs.db_url_pooled }}" ]; then
            echo "::error::DATABASE_URL is empty. Neon API may have failed."
            exit 1
          fi

      - name: Set VERCEL_PROJECT_ID
        run: echo "VERCEL_PROJECT_ID=${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.secret_suffix)] }}" >> $GITHUB_ENV

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment (apps/${{ matrix.app }})
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Get Vercel project name
        id: project-name
        run: |
          PROJECT_NAME=$(curl -s \
            "https://api.vercel.com/v9/projects/${{ env.VERCEL_PROJECT_ID }}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.name')
          if [ -z "$PROJECT_NAME" ] || [ "$PROJECT_NAME" = "null" ]; then
            echo "::warning::プロジェクト名の取得に失敗しました。aliasは設定されません。"
            echo "name=" >> $GITHUB_OUTPUT
          else
            # DNS安全のため小文字に正規化
            PROJECT_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
            echo "name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          fi

      # NOTE: dotenvxはデフォルトで既存の環境変数を上書きしない
      # env:で設定したDATABASE_URLがNeonブランチのURLとして優先される
      - name: Build Project (apps/${{ matrix.app }})
        run: |
          npx dotenvx run -f $GITHUB_WORKSPACE/.env.preview -- \
            vercel build --token=$VERCEL_TOKEN
        env:
          DOTENV_PRIVATE_KEY_PREVIEW: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
          DATABASE_URL: ${{ steps.db-urls.outputs.db_url_pooled }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          npx dotenvx run -f $GITHUB_WORKSPACE/.env.preview -- bash -c '
            declare -a ENV_FLAGS=()
            while IFS= read -r key; do
              case "$key" in
                NEON_*|DOTENV_PUBLIC_KEY_*) continue ;;
              esac
              value="${!key}"
              if [ -n "$value" ]; then
                echo "::add-mask::${value}"
              fi
              ENV_FLAGS+=("--env" "${key}=${value}")
            done < <(grep -E "^[A-Z_][A-Z0-9_]*=\"?encrypted:" "$GITHUB_WORKSPACE/.env.preview" | cut -d= -f1)

            # DATABASE_URLはNeon APIから取得した値を注入（.env.previewには含まれない）
            ENV_FLAGS+=("--env" "DATABASE_URL=${DATABASE_URL}")

            echo "Deploying with ${#ENV_FLAGS[@]} runtime env vars..."
            set +e
            vercel deploy --prebuilt --archive=tgz "${ENV_FLAGS[@]}" --token="$VERCEL_TOKEN" > deployment-url.txt 2>deploy-error.txt
            DEPLOY_EXIT=$?
            set -e

            if [ $DEPLOY_EXIT -ne 0 ]; then
              echo "::error::Vercel deploy failed with exit code $DEPLOY_EXIT"
              echo "--- Deploy stdout ---"
              cat deployment-url.txt
              echo "--- Deploy stderr ---"
              cat deploy-error.txt
              exit $DEPLOY_EXIT
            fi

            DEPLOY_URL=$(tail -n 1 deployment-url.txt)
            if [ -z "$DEPLOY_URL" ]; then
              echo "::error::Deploy succeeded but no URL was captured"
              cat deployment-url.txt
              exit 1
            fi

            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          '
        env:
          DOTENV_PRIVATE_KEY_PREVIEW: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
          DATABASE_URL: ${{ steps.db-urls.outputs.db_url_pooled }}

      - name: Set Vercel alias
        if: steps.project-name.outputs.name != ''
        id: set-alias
        continue-on-error: true
        run: |
          ALIAS="${{ steps.project-name.outputs.name }}-pr-${{ github.event.number }}.vercel.app"
          vercel alias ${{ steps.deploy.outputs.url }} "$ALIAS" --token=$VERCEL_TOKEN
          echo "url=https://$ALIAS" >> $GITHUB_OUTPUT

      # デプロイURLをartifactとして保存
      - name: Save deploy URL
        run: |
          ALIAS_URL="${{ steps.set-alias.outputs.url }}"
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          if [ -n "$ALIAS_URL" ]; then
            echo "$ALIAS_URL" > deploy-url-${{ matrix.app }}.txt
          else
            echo "::warning::Alias未設定のためランダムURLを使用: $DEPLOY_URL"
            echo "$DEPLOY_URL" > deploy-url-${{ matrix.app }}.txt
          fi

      - name: Upload deploy URL
        uses: actions/upload-artifact@v4
        with:
          name: deploy-url-${{ matrix.app }}
          path: deploy-url-${{ matrix.app }}.txt
          retention-days: 1

  # PRコメント
  comment:
    needs: [neon-and-schema, deploy, discover]
    if: github.repository != 'einja-inc/einja-management-template' && always() && needs.neon-and-schema.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy URLs
        uses: actions/download-artifact@v4
        with:
          pattern: deploy-url-*
          merge-multiple: true
        continue-on-error: true

      - name: Read deploy URLs
        id: urls
        run: |
          ROWS=""
          for f in deploy-url-*.txt; do
            [ -f "$f" ] || continue
            APP=$(echo "$f" | sed 's/deploy-url-\(.*\)\.txt/\1/')
            URL=$(cat "$f")
            ROWS="${ROWS}| **${APP}** | ${URL} |\n"
          done
          if [ -z "$ROWS" ]; then
            ROWS="| **-** | No apps deployed |\n"
          fi
          # Use heredoc for multiline output
          {
            echo "rows<<URLS_EOF"
            echo -e "$ROWS"
            echo "URLS_EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- neon-preview-url -->';
            const rows = `${{ steps.urls.outputs.rows }}`;
            const body = [
              marker,
              '## 🚀 Preview Deployment',
              '',
              '| Item | Value |',
              '|------|-------|',
              rows.trim(),
              `| **Neon Branch** | \`preview/pr-${{ github.event.number }}\` |`,
              `| **Neon Parent** | \`${{ needs.neon-and-schema.outputs.neon_parent }}\` |`,
              `| **Commit** | ${{ github.event.pull_request.head.sha }} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
