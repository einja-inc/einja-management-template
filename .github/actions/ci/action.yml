name: 'CI Checks'
description: 'Run CI checks including setup, type check, lint, and tests'

inputs:
  database-url:
    description: 'Database URL for running tests with DB connection'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Environment
      uses: ./.github/actions/setup

    - name: Generate artifacts
      run: pnpm generate
      shell: bash

    - name: Prisma migrate deploy
      if: inputs.database-url != ''
      run: pnpm db:migrate:deploy
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}

    - name: Run TypeScript type check
      run: pnpm typecheck
      shell: bash

    - name: Run lint
      run: pnpm lint
      shell: bash

    - name: Run tests
      run: pnpm test
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
