name: Cleanup PR Preview (on close)

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    # stable-branch間PR（develop→staging, staging→main等）はPR Preview不要のためスキップ
    if: >
      github.repository != 'einja-inc/einja-management-template' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(contains(fromJSON('["main","develop","staging"]'), github.event.pull_request.head.ref) &&
        contains(fromJSON('["main","develop","staging"]'), github.event.pull_request.base.ref))
    runs-on: ubuntu-latest
    outputs:
      apps_json: ${{ steps.apps.outputs.apps_json }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover apps
        id: apps
        uses: ./.github/actions/discover-apps

  cleanup:
    needs: [discover]
    if: github.repository != 'einja-inc/einja-management-template' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.apps_json) }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove Vercel preview alias
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.secret_suffix)] }}
        run: |
          npm install -g vercel@latest
          PROJECT_NAME=$(curl -s \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.name')
          if [ -n "$PROJECT_NAME" ] && [ "$PROJECT_NAME" != "null" ]; then
            PROJECT_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
            ALIAS="${PROJECT_NAME}-pr-${{ github.event.number }}.vercel.app"
            echo "Removing alias: $ALIAS"
            vercel alias rm "$ALIAS" --token=$VERCEL_TOKEN --yes || true # intentional: alias may not exist (idempotent cleanup)
          else
            echo "::warning::プロジェクト名を取得できませんでした (app: ${{ matrix.app }})"
          fi

  # Neon cleanup runs only once (not per-app)
  cleanup-neon:
    if: >
      github.repository != 'einja-inc/einja-management-template' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(contains(fromJSON('["main","develop","staging"]'), github.event.pull_request.head.ref) &&
        contains(fromJSON('["main","develop","staging"]'), github.event.pull_request.base.ref))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Export Neon environment variables
        uses: ./.github/actions/neon-export-env
        with:
          dotenv-private-key-preview: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
      - name: Delete Neon Branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ env.NEON_API_KEY }}
