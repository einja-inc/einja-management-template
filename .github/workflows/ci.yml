name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate artifacts
        run: |
          pnpm generate
          # Panda CSS生成確認
          if [ ! -d "apps/web/styled-system" ]; then
            echo "Error: styled-system directory was not created"
            exit 1
          fi
          echo "Panda CSS generated successfully"
          ls -la apps/web/styled-system

      - name: Run TypeScript type check
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  deploy-web:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: |
          npx dotenvx run -f ../../.env.ci -- \
            vercel pull --yes --environment=production
        working-directory: apps/web

      - name: Build Project Artifacts
        run: |
          npx dotenvx run -f ../../.env.ci -f ../../.env.production -- \
            vercel build --prod
        working-directory: apps/web
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Deploy to Vercel
        run: |
          npx dotenvx run -f ../../.env.ci -- \
            vercel deploy --prebuilt --prod
        working-directory: apps/web
